aid: skyfri
name: Skyfri
description: >-
  Skyfri is a cleantech software and hardware company headquartered in Oslo,
  Norway that builds an operating platform for owners and operators of solar and
  battery energy assets. Founded in 2021, Skyfri combines an edge-native
  monitoring and control device (the SSI hardware, which speaks Modbus and SCADA
  over isolated RS-485 ports to inverters, meters, and sensors) with a cloud
  platform that automates operations, maintenance, and asset performance
  management. The software delivers real-time data processing, operational
  management, weather forecasting, dynamic benchmarking, plant insights, and
  fault detection to monitor generation and address underperformance and
  equipment failure across a global portfolio of solar and battery assets. The
  company has offices in Denver, London, Oslo, Singapore, and Bangalore and is
  backed by Speedinvest. Skyfri exposes no public developer API, documentation,
  or SDKs at this time; its platform is delivered as a customer application at
  app.skyfri.com.
